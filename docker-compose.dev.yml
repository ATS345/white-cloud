version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: yunmu-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: yunmu
      POSTGRES_PASSWORD: yunmu123
      POSTGRES_DB: yunmu_game_store
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - yunmu-dev-network

  redis:
    image: redis:7-alpine
    container_name: yunmu-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - yunmu-dev-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: yunmu-elasticsearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - yunmu-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  elasticsearch_dev_data:
    driver: local

networks:
  yunmu-dev-network:
    driver: bridge
