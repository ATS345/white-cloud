global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: 'yunmu-game-store'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/v1/metrics'
