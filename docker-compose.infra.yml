name: yunmu-game-store-dev

services:
  postgres:
    image: postgres:15-alpine
    container_name: yunmu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yunmu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yunmu123}
      POSTGRES_DB: ${DB_NAME:-yunmu_game_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - yunmu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yunmu} -d ${DB_NAME:-yunmu_game_store}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yunmu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - yunmu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  yunmu-network:
    driver: bridge
